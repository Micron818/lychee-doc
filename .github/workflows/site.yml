name: Site

# Build the public site from site/. Publish to the site bucket only from main.
# Does not build images or deploy khh-test, demo, or khh-prod.
#
# Secrets (this bucket and CDN refresh only):
#   ALIYUN_ACCESS_KEY_ID
#   ALIYUN_ACCESS_KEY_SECRET

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install and build
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm docs:build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/.vitepress/dist
          retention-days: 5

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: site-publish
      cancel-in-progress: false
    env:
      ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      OSS_ENDPOINT: https://oss-ap-southeast-1.aliyuncs.com
      OSS_REGION: ap-southeast-1
      OSS_BUCKET: lycheetech-site
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site-dist

      - name: Resolve dist directory
        id: dist
        run: |
          if [[ -f site-dist/index.html ]]; then
            echo "dir=site-dist" >> "$GITHUB_OUTPUT"
          elif [[ -f site-dist/site/.vitepress/dist/index.html ]]; then
            echo "dir=site-dist/site/.vitepress/dist" >> "$GITHUB_OUTPUT"
          else
            find site-dist -type f -name index.html -print
            echo "index.html not found in artifact" >&2
            exit 1
          fi

      - name: Install ossutil
        run: |
          version=2.4.1
          curl -fsSL -o /tmp/ossutil.zip "https://gosspublic.alicdn.com/ossutil/v2/${version}/ossutil-${version}-linux-amd64.zip"
          unzip -q /tmp/ossutil.zip -d /tmp
          sudo mv "/tmp/ossutil-${version}-linux-amd64/ossutil" /usr/local/bin/ossutil
          sudo chmod 755 /usr/local/bin/ossutil
          ossutil version

      - name: Install Alibaba Cloud CLI
        run: |
          curl -fsSL -o /tmp/aliyun.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf /tmp/aliyun.tgz -C /tmp
          sudo mv /tmp/aliyun /usr/local/bin/aliyun
          aliyun version

      - name: Sync to OSS
        run: |
          if [[ -z "$ALIYUN_ACCESS_KEY_ID" || -z "$ALIYUN_ACCESS_KEY_SECRET" ]]; then
            echo "Set GitHub secrets ALIYUN_ACCESS_KEY_ID and ALIYUN_ACCESS_KEY_SECRET before publishing." >&2
            exit 1
          fi
          export OSS_ACCESS_KEY_ID="$ALIYUN_ACCESS_KEY_ID"
          export OSS_ACCESS_KEY_SECRET="$ALIYUN_ACCESS_KEY_SECRET"
          src="${{ steps.dist.outputs.dir }}"
          dest="oss://${OSS_BUCKET}/"
          ossutil sync "$src" "$dest" --delete --force
          ossutil set-props "$dest" --cache-control "no-cache" --include "*.html" --metadata-directive update -r -f
          ossutil set-props "${dest}vp-icons.css" --cache-control "no-cache" --metadata-directive update -f
          ossutil set-props "${dest}hashmap.json" --cache-control "no-cache" --metadata-directive update -f
          ossutil set-props "${dest}assets/" \
            --cache-control "public, max-age=31536000, immutable" \
            --include "*.js" --include "*.css" --include "*.woff2" \
            --metadata-directive update -r -f

      - name: Refresh CDN HTML
        run: |
          aliyun configure set \
            --profile default \
            --mode AK \
            --region cn-hangzhou \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET"
          aliyun cdn RefreshObjectCaches \
            --ObjectType Directory \
            --ObjectPath "$(printf '%s\n' 'https://lycheetech.com/' 'https://www.lycheetech.com/')"
